<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BearWatch</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f172a;
      --fg: #f8fafc;
      --panel: rgba(15, 23, 42, 0.7);
      --accent: #38bdf8;
      --accent-dark: #0ea5e9;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(59,130,246,0.4), rgba(15,23,42,0.9));
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.25rem 2rem;
      background: linear-gradient(90deg, rgba(14,165,233,0.85), rgba(99,102,241,0.85));
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(15,23,42,0.35);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: 0.04em;
    }
    header span {
      font-size: 0.9rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(15,23,42,0.25);
    }
    main {
      flex: 1;
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      display: grid;
      gap: 1.5rem;
    }
    section {
      background: var(--panel);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(15,23,42,0.35);
      backdrop-filter: blur(10px);
    }
    section h2 {
      margin-top: 0;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(248,250,252,0.85);
    }
    #video-panel {
      display: grid;
      gap: 1rem;
    }
    #video-stream {
      width: 100%;
      border-radius: 16px;
      border: 2px solid rgba(56,189,248,0.4);
      background: rgba(15,23,42,0.65);
      box-shadow: 0 10px 30px rgba(15,23,42,0.45);
    }
    #controls {
      display: grid;
      gap: 1rem;
    }
    #controls .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
      color: rgba(248,250,252,0.65);
    }
    select, button {
      width: 100%;
      border-radius: 12px;
      border: none;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      background: rgba(15,23,42,0.75);
      color: var(--fg);
      border: 1px solid rgba(148,163,184,0.25);
      box-shadow: inset 0 1px 3px rgba(255,255,255,0.05);
    }
    select:focus, button:focus {
      outline: 2px solid rgba(56,189,248,0.7);
      outline-offset: 2px;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(14,165,233,0.4);
    }
    button.secondary {
      background: rgba(15,23,42,0.6);
    }
    #alerts-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1rem;
    }
    .alert-entry {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 1rem;
      align-items: center;
      padding: 1rem;
      border-radius: 16px;
      background: rgba(15,23,42,0.65);
      border: 1px solid rgba(56,189,248,0.15);
    }
    .alert-entry img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(56,189,248,0.25);
    }
    .alert-entry .meta {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(56,189,248,0.15);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #debug-panel {
      display: none;
      white-space: pre-wrap;
      background: rgba(15,23,42,0.75);
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid rgba(148,163,184,0.2);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      font-size: 0.85rem;
      max-height: 240px;
      overflow-y: auto;
    }
    #status-indicator.offline {
      background: rgba(248,113,113,0.2);
      color: var(--danger);
    }
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      min-width: 240px;
      background: rgba(15,23,42,0.9);
      color: var(--fg);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      border: 1px solid rgba(248,113,113,0.4);
      box-shadow: 0 12px 35px rgba(15,23,42,0.5);
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 20;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 768px) {
      main {
        padding-top: 1.5rem;
      }
      .alert-entry {
        grid-template-columns: 1fr;
      }
      .alert-entry img {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>BearWatch Control</h1>
    <span id="status-indicator">ONLINE</span>
  </header>
  <main>
    <section id="video-panel">
      <div>
        <h2>Live Stream</h2>
        <img id="video-stream" src="/video" alt="Live stream" loading="lazy">
      </div>
      <div id="controls">
        <div class="grid">
          <div>
            <label for="class-select">Monitoring</label>
            <select id="class-select"></select>
          </div>
          <div>
            <label>Required Frames</label>
            <div class="badge" id="req-frames">-</div>
          </div>
          <div>
            <label>Min Height Fraction</label>
            <div class="badge" id="min-h-frac">-</div>
          </div>
          <div>
            <label>Cooldown</label>
            <div class="badge" id="cooldown">-</div>
          </div>
          <div>
            <label>Cooldown Remaining</label>
            <div class="badge" id="cooldown-remaining">-</div>
          </div>
          <div>
            <label>FPS</label>
            <div class="badge" id="fps">-</div>
          </div>
        </div>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
          <button id="trigger-button" class="primary">Trigger Snapshot</button>
          <button id="toggle-debug" class="secondary">Toggle Debug</button>
        </div>
        <div id="debug-panel"></div>
      </div>
    </section>

    <section>
      <h2>Recent Alerts</h2>
      <ul id="alerts-list"></ul>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const state = {
      pollingTimer: null,
      retryDelay: 2000,
      lastAlerts: [],
      classes: [],
      debugVisible: false,
    };

    const toastEl = document.getElementById('toast');
    const statusIndicator = document.getElementById('status-indicator');
    const debugPanel = document.getElementById('debug-panel');

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3200);
    }

    async function fetchStatus() {
      const response = await fetch('/status');
      if (!response.ok) {
        throw new Error('Status request failed');
      }
      return response.json();
    }

    async function fetchAlerts(limit = 20) {
      const response = await fetch(`/alerts?limit=${limit}`);
      if (!response.ok) {
        throw new Error('Alerts request failed');
      }
      return response.json();
    }

    function formatTimestamp(ts) {
      try {
        const dt = new Date(ts);
        return new Intl.DateTimeFormat(undefined, {
          year: 'numeric',
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        }).format(dt);
      } catch (err) {
        return ts;
      }
    }

    function renderStatus(status) {
      const reqFrames = status.req_frames ?? '-';
      const minFrac = status.min_h_frac ?? 0;
      const cooldown = status.cooldown ?? { seconds: 0, remaining: 0 };
      const cooldownSeconds = Number(cooldown.seconds ?? 0);
      const cooldownRemaining = Number(cooldown.remaining ?? 0);
      const fps = status.fps ?? { smoothed: 0, raw: 0 };

      document.getElementById('req-frames').textContent = reqFrames;
      document.getElementById('min-h-frac').textContent = Number(minFrac).toFixed(2);
      document.getElementById('cooldown').textContent = `${cooldownSeconds}s`;
      document.getElementById('cooldown-remaining').textContent = `${cooldownRemaining.toFixed(1)}s`;
      document.getElementById('fps').textContent = `${Number(fps.smoothed).toFixed(1)} (${Number(fps.raw).toFixed(1)})`;

      populateClassOptions(status.classes, status.watching);

      if (status.debug && state.debugVisible) {
        debugPanel.textContent = JSON.stringify(status.debug, null, 2);
      }
      debugPanel.style.display = state.debugVisible && status.debug ? 'block' : 'none';
    }

    function renderAlerts(alerts) {
      const list = document.getElementById('alerts-list');
      list.innerHTML = '';
      if (!alerts || alerts.length === 0) {
        const empty = document.createElement('li');
        empty.textContent = 'No alerts yet.';
        empty.style.opacity = '0.7';
        list.appendChild(empty);
        return;
      }
      alerts.forEach((alert) => {
        const item = document.createElement('li');
        item.className = 'alert-entry';

        const thumb = document.createElement('a');
        thumb.href = alert.path;
        thumb.target = '_blank';
        const img = document.createElement('img');
        img.src = alert.path;
        img.alt = 'Alert snapshot';
        thumb.appendChild(img);

        const meta = document.createElement('div');
        meta.className = 'meta';

        const title = document.createElement('strong');
        title.textContent = `Confidence ${alert.conf.toFixed(2)}`;
        meta.appendChild(title);

        const timestamp = document.createElement('span');
        timestamp.textContent = formatTimestamp(alert.ts);
        timestamp.style.opacity = '0.75';
        meta.appendChild(timestamp);

        meta.appendChild(Object.assign(document.createElement('span'), {
          className: 'badge',
          textContent: alert.path,
        }));

        item.appendChild(thumb);
        item.appendChild(meta);
        list.appendChild(item);
      });
      state.lastAlerts = alerts;
    }

    function populateClassOptions(classes, watching) {
      if (!Array.isArray(classes)) return;
      const select = document.getElementById('class-select');
      const lowerWatching = (watching || '').toLowerCase();
      const hasChanged = JSON.stringify(classes) !== JSON.stringify(state.classes);
      if (hasChanged) {
        select.innerHTML = '';
        classes.forEach((cls) => {
          const option = document.createElement('option');
          option.value = cls;
          option.textContent = cls;
          select.appendChild(option);
        });
        state.classes = classes;
      }
      select.value = classes.find((cls) => cls.toLowerCase() === lowerWatching) || watching;
    }

    async function handleClassChange(event) {
      const value = event.target.value;
      try {
        const response = await fetch('/monitor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ class: value }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || 'Failed to update class');
        }
        showToast(`Now watching ${value}`);
      } catch (error) {
        showToast(error.message);
      }
    }

    async function handleTriggerClick() {
      try {
        const response = await fetch('/trigger', { method: 'POST' });
        if (response.status === 409) {
          throw new Error('No frame available to capture yet');
        }
        if (!response.ok) {
          throw new Error('Trigger failed');
        }
        const alert = await response.json();
        state.lastAlerts = [alert, ...state.lastAlerts];
        renderAlerts(state.lastAlerts);
        showToast('Manual snapshot saved');
      } catch (error) {
        showToast(error.message);
      }
    }

    function schedulePoll(delay) {
      clearTimeout(state.pollingTimer);
      state.pollingTimer = setTimeout(poll, delay);
    }

    async function poll() {
      if (document.hidden) {
        state.pollingTimer = null;
        return;
      }
      try {
        const [status, alertPayload] = await Promise.all([
          fetchStatus(),
          fetchAlerts(),
        ]);
        renderStatus(status);
        state.lastAlerts = alertPayload.alerts || [];
        renderAlerts(state.lastAlerts);
        if (!state.debugVisible) {
          debugPanel.style.display = 'none';
        }
        statusIndicator.textContent = 'ONLINE';
        statusIndicator.classList.remove('offline');
        state.retryDelay = 2000;
        schedulePoll(2000);
      } catch (error) {
        console.error(error);
        statusIndicator.textContent = 'OFFLINE';
        statusIndicator.classList.add('offline');
        showToast('Connection lost. Retrying...');
        state.retryDelay = Math.min(state.retryDelay * 1.5, 30000);
        schedulePoll(state.retryDelay);
      }
    }

    function startPolling() {
      if (state.pollingTimer) return;
      schedulePoll(0);
    }

    function stopPolling() {
      clearTimeout(state.pollingTimer);
      state.pollingTimer = null;
    }

    function init() {
      document.getElementById('class-select').addEventListener('change', handleClassChange);
      document.getElementById('trigger-button').addEventListener('click', handleTriggerClick);
      document.getElementById('toggle-debug').addEventListener('click', () => {
        state.debugVisible = !state.debugVisible;
        debugPanel.style.display = state.debugVisible ? 'block' : 'none';
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopPolling();
        } else {
          startPolling();
        }
      });

      startPolling();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
